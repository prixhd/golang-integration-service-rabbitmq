name: Go CI

on:
  push:
    branches:
      - feature/part3
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build code runner image
        run: docker build -t code-runner:latest -f processor/Dockerfile processor/

      - name: Run Go tests
        run: go test ./...